name: CompanyNow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
